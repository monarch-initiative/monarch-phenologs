# Every number the talk shows lives here, once. Figures and slide text read from this file,
# so a new release means editing this file (or regenerating it) and running the build.
#
# Sources
#   preprint   Odell et al. 2026, bioRxiv, doi:10.64898/2026.10.23.761438 (assets/phenologs_preprint_biorxiv.pdf)
#   dashboard  https://monarch-initiative.github.io/monarch-phenologs/ , release 2026-03-06, read 2026-11-11
#   McGary2010 PNAS 107(14):6544-9, PMID 20308572 (numbers as stated in the paper's text)
#   Woods2013  BMC Bioinformatics 14:203, PMID 23800157
#   Cha2012    PLoS Biology 10(8):e1001379, PMID 22927795

meta:
  kg_release: "2026-03-06"
  kg_prior: "2025-03-10"
  phenio: "2025-11-14"
  preprint: "Odell et al. 2026, bioRxiv"
  doi: "10.64898/2026.10.23.761438"
