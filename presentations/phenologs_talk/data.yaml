  diseases_evaluated: {1: 168, 5: 274, 20: 322, 100: 332}   # diseases whose hidden genes surface, by k (Fig. S7A, total column)
  # Panels C and D are NOT leave-one-out runs: the complete model, no genes withheld, k = 100, across the diseases
