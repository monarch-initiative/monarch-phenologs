# Made-up numbers for the hypergeometric explainer (labelled "illustrative" on the slide).
# expected = n * m / N.  c: times the gene turns up in the disease's phenologs.
hg_illustration:
  N: 600000          # all gene-phenotype annotations
  n: 5000            # annotations pulled in by the disease's phenologs
  specific: {label: "A specific gene", m: 40,   c: 30}
  hub:      {label: "A hub gene",      m: 2000, c: 30}
  # The two-genes marble slide (figure marbles_two_genes) is drawn to these counts exactly, so the P values on it
  # are exact for the picture: P(X >= drawn), with N = bag, n = handful, m = own. Keep bag a multiple of handful
  # (the slide says "a sixth of the bag") and handful one of 17, 20, 23... (three rows in the tray).
  # The three-panel marble slide (figure marbles) uses real numbers instead: bbs.score_example.
  marbles:
    bag: 120             # N: one marble per gene-phenotype annotation
    handful: 20          # n: marbles the disease's phenologs draw
    specific: {own: 6,  drawn: 5}
    hub:      {own: 30, drawn: 5}
