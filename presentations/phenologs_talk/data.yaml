  repo_url: "github.com/monarch-initiative/monarch-phenologs"

# ---------------------------------------------------------------------------------------------
# The problem (slide text only; see deck.yaml notes for what still needs a citation)
problem:
  yield_low: 30          # % diagnostic yield of exome or genome sequencing in rare disease (from the outline doc)
  yield_high: 50         # the slide shows the complement: 50-70% still undiagnosed
  # Printed under the number. Both checked against their PubMed abstracts on 2026-11-16:
  # Chung et al. 2023, Genet Med 25:100896 (PMID 37191093): 161 studies, 50,417 probands; pooled yield exome 0.38, genome 0.34.
  # Clark et al. 2018, npj Genom Med 3:16 (PMID 30002876): 37 studies, 20,068 children; genome 0.41, exome 0.36.
  # So pooled estimates leave about 59-66% undiagnosed; large cohorts run from 59% (DDD) to 75% (100,000 Genomes pilot).
  yield_source: "Chung et al. 2023, Genet Med · Clark et al. 2018, npj Genom Med"
  # the "Why no diagnosis?" cards, in order. focus: the one this talk is about, drawn highlighted (kept last).
  # sub may be a list: one entry per line.
  reasons:
    - head: "The variant is hard to detect"
      sub: ["structural, non-coding, repeat expansions", "technical limitations"]
    - {head: "The variant can't be interpreted",         sub: "variants of uncertain significance"}
    - {head: "The cause isn't purely genetic",           sub: "environmental exposures, gene–environment interactions"}
    # round 3: "Mendelian and complex diseases" is the pairing the preprint's introduction uses
    - head: "The gene isn't linked to the disease yet"
      sub: ["many suspected Mendelian diseases still have no known gene,", "and complex diseases still have incomplete gene lists"]
      focus: true

