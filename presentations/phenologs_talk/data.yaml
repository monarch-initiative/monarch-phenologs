# ---------------------------------------------------------------------------------------------
# Earlier phenolog studies, for the "then and now" comparison.
history:
  mcgary2010:
    cite: "McGary et al. 2010"
    journal: "PNAS"
    pmid: 20308572
    title: "Systematic discovery of nonobvious human disease models through orthologous phenotypes"
    species: 5                         # human, mouse, yeast, worm, Arabidopsis
    species_names: "human, mouse, worm, yeast, Arabidopsis"
    gene_phenotype_associations: 212542
    human_gene_disease_associations: 1923
    human_diseases_approx: 300
    # per species, "Systematic Discovery of Phenologs" and the Arabidopsis section; they add up to 212,542.
    # Human is OMIM gene-disease only: no human phenotype (HPO) annotations in the 2010 data.
    associations: {human: 1923, mouse: 74250, worm: 27065, yeast: 86383, arabidopsis: 22921}
    model_phenotypes_label: "> 6,000"      # mouse, worm and yeast together; Arabidopsis adds 1,711
    # the paper's own definition (Results and Discussion), quoted on the slide
    definition: "phenotypes related by the orthology of the associated genes in two organisms"
    phenologs_total: 6200              # ">6,200 significant phenologs", all species pairs
    phenologs_human_mouse: 3755
    randomizations: 1000
    # The rest of this block: main text of the paper, read from PMC2851946 on 2026-11-12.
    authors: "McGary, Park, Woods, Cha, Wallingford & Marcotte"
    human_diseases_label: "≈ 300"
    orthology: "pairwise ortholog groups with in-paralogs (Remm et al. 2001)"
    bbs: {human_genes: 11, mouse_traits: 4, p_at_most: 1.0e-11}     # Bardet-Biedl vs four mouse ciliary traits
    # the headline non-obvious models. a/b: the two phenotypes, in the paper's wording; key: our species key if we have one.
    classics:
      - a: {code: Sc, species: "yeast", label: "lovastatin sensitivity"}
        b: {code: Mm, species: "mouse", label: "angiogenesis defects", key: mouse}
        outcome: "5 shared genes, of 67 and 8. New gene SOX13, confirmed in frog embryos and human cells."
      - a: {code: At, species: "plant", label: "negative gravitropism defects"}
        b: {code: Hs, species: "human", label: "Waardenburg syndrome", key: human}
        outcome: "3 Waardenburg genes against 5 plant genes. New gene SEC23IP: neural crest migration defects in frog."
      - a: {code: Ce, species: "worm", label: "high frequency of male progeny", key: worm}
        b: {code: Hs, species: "human", label: "breast / ovarian cancer", key: human}
        outcome: "13 new candidate genes; 9 of them already tied to breast cancer in the literature."
    # The "idea" slide (id: idea). The four model organisms compared with human disease, in the order they sit around
    # the human network (counter-clockwise from the top left, nearest relative first). name: the key into
    # `associations` above; key: our own species key, where the species is also in our data (it keeps that colour).
    # phenologs_with_human: 5% FDR, "Systematic Discovery of Phenologs" and, for Arabidopsis, the plant section.
    models:
      - {name: mouse,       code: Mm, common: Mouse,         key: mouse,       phenologs_with_human: 3755}
      - {name: worm,        code: Ce, common: Worm,          key: worm,        phenologs_with_human: 9}
      - {name: yeast,       code: Sc, common: Budding yeast, color: "#8E5A9B", phenologs_with_human: 154}
      - {name: arabidopsis, code: At, common: Arabidopsis,   color: "#6A9A1F", phenologs_with_human: 48}
    human_source: "OMIM"
    # The plant model of Waardenburg syndrome: main text and Fig. 4 of the paper, read from PMC2851946 on 2026-11-15.
    # Gene counts consider human/Arabidopsis orthologs only. Fig. 4B is a Venn of 1 | 2 | 3: three Waardenburg genes,
    # five plant genes, two shared; the three plant-only genes give the candidates STX7/STX12, DDHD2/SEC23IP and DNAJC13.
    waardenburg:
      model: arabidopsis
      disease: "Waardenburg syndrome"
      disease_gloss: "a neural crest disorder"          # "stems from defects in the developing neural crest"
      human_genes: 3
      phenotype: "Negative gravitropism defects"
      phenotype_gloss: "shoots fail to grow against gravity"
      plant_genes: 5
      shared: 2
      candidates: 3
      tested_gene: "SEC23IP"
      frog_gene: "sec23ip"                               # Xenopus laevis, morpholino knockdown on one side of the embryo
      frog_code: Xl
      defect: [23, 35]                                   # neural crest migration defects, snai2-a marker
      control: [0, 21]                                   # untreated control animals, snai2-a
      defect_twist: [8, 14]                              # the second marker
  cha2012:
    cite: "Cha et al. 2012"
    journal: "PLoS Biology"
    pmid: 22927795
    authors: "Cha, Byrom, Mead, Ellington, Wallingford & Marcotte"      # PubMed, read 2026-11-13
    title: "Evolutionarily repurposed networks reveal the well-known antifungal drug thiabendazole to be a novel vascular disrupting agent"
  woods2013:
    cite: "Woods et al. 2013"
    journal: "BMC Bioinformatics"
    pmid: 23800157
    authors: "Woods, Singh-Blom, Laurent, McGary & Marcotte"            # PubMed, read 2026-11-13
    title: "Prediction of gene-phenotype associations in humans, mice, and plants using phenologs"
    orthology: "INPARANOID (Östlund et al. 2010)"                       # stated in the paper's Results

# ---------------------------------------------------------------------------------------------
# Rod-cone dystrophy, the patient-phenotype example (phenotype network). dashboard, HP:0000510.
# c: shared families; m: human families with an ortholog in that species; n: model phenotype families;
# N: families in both species.
rod_cone:
  id: "HP:0000510"
  label: "Rod-cone dystrophy"
  known_genes: 152
  phenologs: 688
  by_species: {mouse: 565, zebrafish: 99, worm: 24}
  punchline: "A worm has no retina. It does have sensory cilia, built by orthologs of the same genes."
  # the two cards under the tree, in Aaron's wording (round 1 edits, 2026-11-16)
  similar_text: "Semantically similar and/or obvious biological connection (e.g. a retina or “eye” related phenotype in a mouse or fish relating back to a human eye related phenotype)"
  nonobvious_text: "Only made apparent through gene and pathway level information (e.g. C.\u00a0elegans, which has no eyes, can still be used to map information onto human eye biology. “Cilia morphology variant” is a good example of this)"
  examples:
    - {species: mouse,     label: "retina degeneration",          id: "MP:0001326",          c: 40, m: 140, n: 97, N: 7394, p: 3.8e-45, obvious: true}
    - {species: zebrafish, label: "notochord kinked",             id: "ZP:0001556",          c: 17, m: 138, n: 39, N: 6479, p: 4.8e-19, obvious: false}
    - {species: worm,      label: "osmotic avoidance defective",  id: "WBPhenotype:0000249", c: 8,  m: 108, n: 23, N: 3931, p: 8.7e-8,  obvious: false}
    - {species: worm,      label: "ivermectin resistant",         id: "WBPhenotype:0002053", c: 7,  m: 108, n: 25, N: 3931, p: 3.1e-6,  obvious: false}
  # The single phenolog walked through on the "Phenologs conceptualized" slide: HP:0000510 against MP:0001326.
  # dashboard term page, read 2026-11-13. RHO, PDE6B and CRB1 are three of the 152 annotated genes; PTHR24240 is
  # RHO's family. Mouse gene count and examples as on the Bardet-Biedl derivation (same mouse phenotype).
  derivation:
    genes: 152
    gene_examples: "RHO, PDE6B, CRB1"
    families: 140                          # the families of those genes that human and mouse share
    phenotype: "retina degeneration"
    phenotype_id: "MP:0001326"
    phenotype_genes: 115
    phenotype_gene_examples: "Rho, Pde6b, Crb1"
    phenotype_families: 97
    family_example: "PTHR24240"
    shared: 40
    N: 7394
    p: 3.8e-45
    # The genes behind the 57 mouse-only families (97 - 40). dashboard, MP:0001326 "Genes annotated" table against the
    # 152 known genes of HP:0000510, read 2026-11-13: 102 of the 115 mouse genes have a family; the 57 mouse-only
    # families carry 58 of them (one family has two: Mpp3 and Pals1), each with one human ortholog listed.
    phenotype_genes_with_family: 102
    mouse_only_genes: 58
    mouse_only_examples: "RPGRIP1, NMNAT1, GUCY2D"     # three of the 58 human orthologs, for the notes
  # Phenologs shown on the tree slide, strongest first within a species (dashboard, read 2026-11-13; zebrafish labels
  # without their ", abnormal" suffix). obvious: true when the model phenotype reads like the human one (a judgement call).
  tree:
    mouse:
      - {label: "retina degeneration",                             c: 40, n: 97,  p: 3.8e-45, obvious: true}
      - {label: "abnormal photoreceptor outer segment morphology", c: 35, n: 70,  p: 3.6e-43, obvious: true}
      - {label: "abnormal rod electrophysiology",                  c: 37, n: 119, p: 2.9e-36, obvious: true}
    zebrafish:
      - {label: "notochord kinked",                                c: 17, n: 39,  p: 4.8e-19, obvious: false}
      - {label: "pronephros cystic",                               c: 21, n: 117, p: 2.4e-14, obvious: false}
      - {label: "retina layer formation disrupted",                c: 15, n: 74,  p: 2.4e-11, obvious: true}
      - {label: "retinal outer nuclear layer decreased thickness", c: 9,  n: 24,  p: 6.9e-10, obvious: true}
    worm:
      - {label: "osmotic avoidance defective",                     c: 8,  n: 23,  p: 8.7e-8,  obvious: false}
      - {label: "cilia morphology variant",                        c: 7,  n: 22,  p: 1.2e-6,  obvious: false}
      - {label: "ivermectin resistant",                            c: 7,  n: 25,  p: 3.1e-6,  obvious: false}

