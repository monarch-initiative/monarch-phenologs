# ---------------------------------------------------------------------------------------------
# What the pipeline takes from the Monarch KG, for the "Monarch KG for phenolog calculations" slide.
# preprint Supplementary Note 1 (Table S1: Biolink categories and predicates; Table S2: ontologies per species;
# Table S3: root terms kept), Supplementary Note 2 (PANTHER orthology) and Fig. 1A (gene id sources);
# the selection itself is python/02_kg_data_extraction.py. Counts come from `human`, `species` and `totals` above.
kg:
  human:
    gene_ids: HGNC
    disease_ontology: Mondo            # prefix MONDO; only terms under "human disease" (MONDO:0700096)
    phenotype_ontology: HPO            # prefix HP; only terms under "phenotypic abnormality" (HP:0000118)
  # gene id source per model species; the phenotype ontology is species[].ontology
  gene_ids: {mouse: MGI, rat: RGD, frog: Xenbase, zebrafish: ZFIN, worm: WB, pombe: PomBase, dicty: dictyBase}
  orthology:
    source: PANTHER
    example_family: "PTHR24240"        # RHO's family, the one named on the next slide
  biolink:
    gene: "biolink:Gene"
    disease: "biolink:Disease"
    phenotype: "biolink:PhenotypicFeature"
    gene_disease: ["biolink:CausalGeneToDiseaseAssociation", "biolink:CorrelatedGeneToDiseaseAssociation"]
    gene_phenotype: "biolink:GeneToPhenotypicFeatureAssociation"
    gene_phenotype_predicate: "biolink:has_phenotype"
    orthology: "biolink:GeneToGeneHomologyAssociation"
    orthology_predicate: "biolink:orthologous_to"
    orthology_evidence: "PANTHER.FAMILY:PTHR…"      # the has_evidence value an orthology edge must carry to be kept
    # not on the slide, for the notes (Table S1)
    causal_predicates: "biolink:causes, biolink:associated_with_increased_likelihood_of"
    correlated_predicates: "biolink:gene_associated_with_condition, biolink:contributes_to"

