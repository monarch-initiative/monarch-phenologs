  # The additive decomposition of the dashboard's term page with "top phenologs" set to 10 (figure
  # bbs_decomposition): the disease's ten best phenologs and the protein families they carry. Dashboard database,
  # tables phenologs and additive of release 2026-03-06, read 2026-11-16.
  #   A phenolog's weight is shared / 26 known families x (1 - p). A family's additive score is the sum of the
  #   weights of the phenologs that carry it (`ranks`; `on` would be read as a boolean by YAML). Both are computed in the figure. Labels are the dataset's, without the
  #   trailing ", abnormal" of the zebrafish terms.
  #   families: the 16 that score 2.0 or more, in the dashboard's order (five more tie just below, at 1.92).
  #   `known` and `other` are the family's human genes; `other` names the first of `n_other`.
  #   `obvious` is a judgement call: does the model phenotype look like something a patient has?
  decomposition:
    phenologs:
      - {rank: 1,  species: zebrafish, label: "gastrulation disrupted",                    shared: 14, p: 9.6e-28, obvious: false}
      - {rank: 2,  species: zebrafish, label: "notochord kinked",                          shared: 14, p: 5.4e-26, obvious: false}
      - {rank: 3,  species: zebrafish, label: "somite increased width",                    shared: 14, p: 2.0e-23, obvious: false}
