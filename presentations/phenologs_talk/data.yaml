  recall:                    # hg, per disease, top N candidates
    - {n: 10,   hits: 2,  fold: 52}
    - {n: 20,   hits: 3,  fold: 39}
    - {n: 100,  hits: 9,  fold: 23.5}
    - {n: 1000, hits: 20, fold: 5}
  top100_ci: "10.5–39.2"
