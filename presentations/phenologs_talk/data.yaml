  pooled_hits: 4
  pooled_expected: 0.3
  pooled_fold: 14
  prospective: {gene: FAAP100, disease: "Fanconi anemia", reported: "April 2025"}
  species_recall:            # genuine new pairs reachable from each species' ranking alone
