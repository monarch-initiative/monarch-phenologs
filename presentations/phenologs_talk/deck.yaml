      Backup for the evaluation slide: where the 73 pairs come from. Disease-gene discovery is continuous, so versioned KG releases give a natural time split.
      Rebuild phenologs and rankings on Monarch KG {meta.kg_prior}; score against pairs added by {meta.kg_release}.
