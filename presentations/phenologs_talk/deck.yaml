  - id: recover_known
    kind: figure
    section: "Backup"
    title: "Leave one out cross validation to assess per disease precision recall"
    lede: "Remove a protein family from the human network side, then recompute phenolog predictions and assess gene-disease assignment"
    lede_size: 15                 # the title runs to two lines: the lede was made smaller and moved under it by hand
    lede_box: [0.677, 1.361, 12.494]
    figure: recover_known
    notes: |
      Backup (moved here by hand on 2026-11-16). About 2 minutes. The time split tests new biology, but on only {evaluation.genuine} pairs. The second kind of test uses
      what is already known, and there is far more of that. Two parts.
      Left: leave-one-out cross validation, adapted from Woods et al. 2013.
      1. Take one PANTHER protein family and remove all of its genes from the human gene-disease network.
      The whole family goes, not one gene: phenologs are computed on families, so a paralog left behind would keep
      the family on the disease and make the test trivial.
      2. Recompute everything from scratch: every phenolog against the seven model species, then every disease's
      candidate ranking, with both scores (naive Bayes and hypergeometric), combining the top k = 1, 5, 20 or 100 phenologs.
      3. Read where the hidden genes come back in the candidate list of each disease they were annotated to.
      When a disease has more than one hidden gene we take the median of their ranks.
      Repeat for each of the {loo.families_hidden:,} families that carry a human disease gene.
      A disease annotated to a single family cannot be tested: with that family hidden it has nothing left to find
      a phenolog with.
      Right: precision. For the {loo.compared_diseases} diseases with at least {loo.min_known_genes} known genes, take the ranked candidate list and
      walk down it. Precision: of the candidates so far, how many are known genes. Recall: of the known genes, how
      many have been found so far. The area under that curve (AUPRC) is one number per disease, and it would be 1
      if every known gene sat at the very top. We compute it once for each score.
      Say this clearly: the right half is the complete model at k = {loo.precision_k}, with no genes hidden (preprint
      Supplementary Note 7). A disease's own genes helped find its phenologs, so the absolute numbers are
      optimistic. What it measures fairly is one score against the other, on identical candidate lists.
      The list and the curve on the slide are a made-up example: 8 candidates, 4 of them known genes.
      Next slide: what both tests showed.
      If asked. The same leave-one-out runs are also read the other way round: take a hidden gene and ask where its
      true disease ranks among all the diseases the gene is ranked for (two slides on). Tied scores get the average rank.
      Why at least four known genes: so that there is a curve to draw. That is my reading; the preprint does not
      give the reason. The preprint counts known genes that have an ortholog in a modeled species.

  - id: precision
    kind: figure
    section: "Backup"
    title: "Our score puts known genes nearer the top"
    lede: "hg is the more precise ranking in {loo.more_precise_diseases} of {loo.compared_diseases} diseases, with {loo.recall_top20_hg}% of known genes in the top 20."
    figure: precision
    notes: |
      Backup (moved here by hand on 2026-11-16). About 1.5 minutes (preprint Fig. S7C and D).
      Both panels: the complete model, no genes hidden, k = {loo.precision_k}, the {loo.compared_diseases} diseases with at least {loo.min_known_genes} known genes.
      Left: for each list size N, the mean share of a disease's known genes inside its top N. At N = 20, hg has
      {loo.recall_top20_hg}% and naive Bayes {loo.recall_top20_nb}%. The dotted line is the ceiling: {loo.recall_ceiling_pct}% of known genes are in the candidate list at
      all, the same for both scores because they rank the same candidates.
      Right: one point per disease, its AUPRC under naive Bayes (x) against hg (y). Points above the diagonal are
      diseases where hg is the more precise ranking: {loo.more_precise_diseases} of {loo.compared_diseases} ({loo.more_precise_pct}%), by a median of {loo.auprc_median_gain}.
      Caveat to say: nothing is hidden here, so absolute recall is optimistic. The fair reading is hg against
      naive Bayes on identical lists.
      Leave-one-out, the box at the lower right (heatmaps are on the next slide). Within a disease the two scores bring
      hidden genes back at near identical rates, as expected from the same candidate pool. Read across diseases,
      hg places the hidden gene's true disease in the top 20 for {loo.true_disease_top20_hg} diseases at k = {loo.k}, naive Bayes for {loo.true_disease_top20_nb}.
      Naive Bayes loses resolution as more phenologs are combined, because its scores saturate toward 1.
      So: hg matches naive Bayes within a disease, is more precise at the top of the list, and is the only one of
      the two that can rank across diseases.

  - id: loo
    kind: figure
    section: "Backup"
    title: "Leave-one-out: where the hidden genes rank"
    lede: "Hide each of {loo.families_hidden:,} annotated protein families in turn and ask whether its genes come back."
    figure: loo
    notes: |
      Preprint Supplementary Note 7, Fig. S7; adapted from Woods et al. 2013. Also a fidelity check on the rewritten code.
      Top heatmap: rank of the hidden gene among a disease's candidates. hg and naive Bayes are interchangeable.
      Bottom heatmap: rank of the true disease among all diseases the hidden gene is ranked for. This needs scores
      that compare across diseases. At k = 20, hg puts the true disease in the top 20 for 165 diseases, naive Bayes for 12.
      On the complete model hg also recovers more known genes at every list size (45% against 39% in the top 20)
      and is the more precise ranking in 67% of diseases: that part is on the previous slide, "Our score puts known genes
      nearer the top".

