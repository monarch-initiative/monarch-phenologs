  - id: hypergeom_two_genes
    skip: true                   # taken out of the deck by hand on 2026-11-16: two genes in one bag, made-up counts
    kind: figure
    section: "Candidate genes"
    title: "Our score: same count, different verdict"
    lede: "Two genes each turn up {hg_illustration.marbles.specific.drawn} times in the handful. Only for one of them is that a surprise."
    figure: marbles_two_genes
    notes: |
      Optional follow-up to the previous slide, which works the score through for one real gene: that slide says
      how the score works, this one says why a count is not enough. Made-up numbers here.
      About 1.5 minutes.
      One bag: every gene-phenotype annotation in the seven model species, one marble each. One handful: what the
      disease's phenologs draw.
      Two genes are marked. Orange is a specific gene with {hg_illustration.marbles.specific.own} marbles in the
      whole bag. Navy is a hub gene, annotated to many phenotypes, with {hg_illustration.marbles.hub.own}.
      Both turn up {hg_illustration.marbles.specific.drawn} times in the handful, so by count alone they tie.
      The handful is a sixth of the bag, so chance predicts a sixth of each gene's marbles: 1 orange, 5 navy.
      Five of the six orange marbles came out: P = 4.4 x 10^-4, a strong candidate. Five of the thirty navy ones
      came out, which is what chance predicts: P = 0.60.
      The naive Bayes score never looks at how many marbles a gene has in the bag. The hypergeometric score does.
      Navy box: every gene is judged against the same bag, so scores compare across diseases. That gives one global
      list: {totals.ranked_pairs:,} ranked gene-disease pairs across {totals.diseases_with_phenologs:,} diseases.
      The picture is drawn to its own made-up counts (hg_illustration.marbles in data.yaml), so both P values are
      exact for the picture. The expected counts and P values in this note are typed; update them if the counts change.

  - id: takehome
    skip: true                   # taken out of the deck by hand on 2026-11-16: the three take-home numbers
    kind: stats
    section: "Next"
    title: "Take-home"
    stats:
      - big: "{totals.disease_phenologs:,}"
        head: "disease phenologs"
        body: "{totals.diseases_with_phenologs:,} human diseases against seven model species, at {totals.fdr_pct}% FDR"
      - big: "{totals.ranked_pairs:,}"
        head: "ranked gene–disease pairs"
        body: "one hypergeometric score, comparable across diseases"
      - big: "23.5×"
        head: "over a random gene"
        body: "9 of {evaluation.genuine} pairs added the following year sit in their disease's top 100"
    closing: "Decades of model-organism phenotyping, from mouse to slime mold, turned into ranked hypotheses for human disease."
    notes: |
      30 seconds. Phenologs revived on a modern knowledge graph; a score that lets candidates be compared across
      diseases; evidence that it anticipates new gene-disease links; and everything is released.

  - id: hypergeom
    skip: true                   # taken out of the deck by hand on 2026-11-16: the dot-grid score explainer, made-up numbers
    kind: figure
    section: "Candidate genes"
    title: "Our score: a gene-level hypergeometric"
    lede: "Is this gene in the disease's phenologs more often than its background frequency predicts?"
    figure: hypergeom
    notes: |
      Backup. The earlier dot-grid version of the score explainer, with made-up numbers. The talk uses the marble
      slide (hypergeom_marbles), which works one real gene through Bardet-Biedl syndrome.
      About 1.5 minutes.
      Think of every gene-phenotype annotation in the cross-species graph as a ball in an urn: N.
      The disease's top-k phenologs pull out n of them. A given gene owns m balls in the whole urn, and c of them
      came out in the draw. The score is the hypergeometric upper tail: the chance of seeing c or more.
      So a specific gene that keeps turning up scores far better than a hub gene that turns up just as often but
      is annotated to thousands of phenotypes. The numbers on the right are illustrative, not from the data.
      Because every gene is judged against the same background, scores are comparable across diseases. That gives
      one global list: {totals.ranked_pairs:,} ranked gene-disease pairs across {totals.diseases_with_phenologs:,} diseases.

  - id: fdr
    skip: true                   # taken out of the deck by hand on 2026-11-16: how the 5% FDR cutoff is set
    kind: figure
    section: "Backup"
    title: "How a phenolog earns significance"
    lede: "A pair counts only if real networks beat {totals.randomized_trials:,} randomized ones at a {totals.fdr_pct}% false discovery rate."
    figure: pipeline_fdr
    notes: |
      About 1.5 minutes.
      Five steps. Extract the eight-species subgraph. Collapse {human.genes_with_ortholog:,} human genes to
      {human.families:,} PANTHER families. Test every disease against every model phenotype: about 320 million
      hypergeometric tests for the disease network.
      With that many tests we need a null. Shuffle the gene-phenotype links 1,000 times per species pair, keeping
      each phenotype's gene count, and recompute everything. The plot is real against randomized for human-mouse.
      The cutoff is the most permissive P at which randomized pairs are at most 5% of real ones (McGary 2010).
      For mouse that is P <= 2.7e-4, 51,766 pairs, realised FDR 3.8%.

  - id: part1_old
    skip: true                   # taken out of the deck by hand on 2026-11-16: an earlier Part 1 divider
    kind: divider
    style: carolina
    label: "PART 1 · WHAT IS A PHENOLOG"
    title: "How does a model-organism phenotype get back to a human?"
    notes: |
      A mouse gene with a mouse phenotype tells you something about the human ortholog, but what?
      The phenotype vocabularies differ and the anatomy differs. One answer is the phenolog.

  - id: part2_old
    skip: true                   # taken out of the deck by hand on 2026-11-16: an earlier Part 2 divider
    kind: divider
    style: navy
    label: "PART 2 · PHENOLOGS AT KNOWLEDGE-GRAPH SCALE"
    title: "We have far more data now. So we rebuilt phenologs."
    notes: |
      Phenologs were last computed systematically in 2013, on a fraction of today's data.
      We set out to revive them: rebuild the toolkit, and run it on everything the Monarch KG holds.

  - id: mcgary_models
    skip: true                   # the earlier 2010 slide: the paper, its data tiles and its three non-obvious models
    kind: figure
    section: "What is a phenolog"
    title: "Phenologs: an idea from 2010"
    lede: "McGary et al. asked which phenotypes, in different species, come from the same genes."
    figure: mcgary2010
    notes: |
      About 1.5 minutes. The idea is not ours: McGary et al. 2010, PNAS (PMID {history.mcgary2010.pmid}), from the Marcotte lab.
      Phenolog: an orthologous phenotype. Two phenotypes in different species are phenologs when their genes are
      orthologs of each other more often than chance allows.
      What they had: five species (human, mouse, worm, yeast, Arabidopsis), {history.mcgary2010.gene_phenotype_associations:,} gene-phenotype
      associations, about 300 human diseases, more than 6,200 phenologs at 5% FDR from 1,000 permutations.
      The title says "nonobvious", and that is what made the paper:
      yeast lovastatin sensitivity matched mouse angiogenesis defects (5 shared genes of 67 and 8, P <= 1e-6); they
      predicted SOX13 and confirmed it by knockdown in Xenopus and in human endothelial cells.
      Plant negative gravitropism defects matched Waardenburg syndrome (3 known genes against 5 plant genes); they
      predicted SEC23IP, and knocking it down in Xenopus gave neural crest migration defects (23 of 35 embryos).
      Worm high frequency of male progeny matched breast/ovarian cancer (the paper's term is X-linked breast/ovarian
      cancer): 13 new candidate genes, 9 of which the literature already tied to breast cancer.
      Bardet-Biedl syndrome was in that paper too, with 11 genes, matching four mouse ciliary phenotypes.
      Next: how the test works, step by step.

  - id: classical
    skip: true                   # replaced by the concept and rodcone_tree slides (the two-network cartoon, build 1)
    kind: figure
    section: "What is a phenolog"
    title: "A patient phenotype and its mouse counterpart"
    figure: phenolog_cartoon
    steps:
      - step: 1
        lede: "A patient has rod-cone dystrophy. Mouse has a phenotype called retina degeneration."
    notes: |
      About 45 seconds. The recipe from the 2010 paper, on one of our own pairs: phenotype against phenotype.
      A Bardet-Biedl patient presents with rod-cone dystrophy. That HPO term has {rod_cone.known_genes} known genes.
      Mouse has a phenotype term, retina degeneration, with its own genes. Different species, different ontology.
      To compare the two gene sets we first have to say which human gene is the same gene as which mouse gene.
      That is the gene-equivalence problem, next slide.

  - id: equivalence
    skip: true                   # the gene-equivalence slide: now one column of the concept slide and a line on then_now
    kind: figure
    section: "What is a phenolog"
    title: "First problem: which genes are the same gene?"
    lede: "Orthologs are rarely one-to-one, so every gene is rolled up to its PANTHER protein family."
    figure: gene_equivalence
    notes: |
      About 1.5 minutes.
      Orthologs are genes in two species that descend from one gene in their common ancestor. Paralogs come from a
      duplication inside one lineage. So the mapping is often not one-to-one.
      Four cases. One to one: easy. One to many: the gene duplicated in the model lineage (zebrafish often carries
      two copies after the teleost genome duplication). Many to one: it duplicated on the human side.
      Many to many: paralogs on both sides.
      PANTHER builds a phylogenetic tree and a hidden Markov model for each protein family, and assigns every gene to
      exactly one family (and a subfamily). We replace each gene by its family: {human.genes_with_ortholog:,} human genes with an
      ortholog become {human.families:,} families. All four cases turn into the same thing: one family on each side.
      That gives one unit of comparison across all eight species. The cost is resolution: paralogs with different
      jobs share a family. We get the gene-level detail back later, when candidates are ranked gene by gene.
      McGary et al. used pairwise ortholog groups with in-paralogs (Remm et al. 2001) for the same purpose; we use
      PANTHER families because the Monarch KG already carries them on every orthology edge.

  - id: classical_test
    skip: true                   # replaced by the concept and rodcone_tree slides (the two-network cartoon, builds 2 and 3)
    kind: figure
    section: "What is a phenolog"
    title: "A patient phenotype and its mouse counterpart"
    figure: phenolog_cartoon
    steps:
      - step: 2
        lede: "Their gene sets overlap far more than chance allows. That overlap makes them phenologs."
      - step: 3
        lede: "Phenologs predict in both directions: the genes they do not share become candidates."
    notes: |
      About 1.5 minutes across the two builds.
      Build 1. With genes as PANTHER families, count the overlap: 40 shared, out of 140 human and 97 mouse
      families, among 7,394 families the two species have in common. Hypergeometric P = 3.8e-45.
      Two phenotypes whose orthologous gene sets overlap more than chance are phenologs: orthologous phenotypes.
      Build 2. Because the link is gene overlap, it predicts both ways. The 57 mouse families not yet tied to the
      human phenotype are candidates for it. Guilt by association.
      This one is semantically obvious: eye to eye. The cartoon is schematic; the numbers are real (dashboard, HP:0000510).

  - id: nonobvious
    skip: true                   # the breast-ovarian cancer version of the non-obvious slide; rodcone_tree carries the point now
    kind: figure
    section: "What is a phenolog"
    title: "…and counterparts nobody would guess"
    lede: "{hboc.label} has {hboc.phenologs} phenologs. One is a zebrafish with no females."
    figure: nonobvious_hboc
    notes: |
      About 1.5 minutes. The emergent-property slide, on a disease everyone knows.
      Hereditary breast ovarian cancer syndrome: {hboc.known_genes} genes (BRCA1, BRCA2, ATM, PALB2, RAD51C...), {hboc.phenologs} phenologs in five species.
      Mouse increased mammary adenocarcinoma incidence is what you would expect.
      Zebrafish female organism absent: mutants in these genes grow up all male. Worm: germ cells fail to arrest after
      UV. Fission yeast: sensitive to ionizing radiation. No semantic similarity search would connect these to breast cancer.
      Why: a gene's molecular function is conserved, the organism-level phenotype is not. The phenotype is an
      emergent property of the system the gene sits in (McGary et al. 2010, Introduction).
      Interpretation to say out loud: the shared module is DNA double-strand break repair and the damage checkpoint.
      CHECK you are happy with that framing before presenting. It also echoes the 2010 paper's worm model of breast cancer.
      Numbers: dashboard, MONDO:0003582. This is a disease term; in 2010 the human "phenotypes" were diseases too.

  - id: nonobvious_rodcone
    skip: true                   # the earlier version of the slide above: rod-cone dystrophy and the worm with no eyes
    kind: figure
    section: "What is a phenolog"
    title: "…and a counterpart nobody would guess"
    lede: "Rod-cone dystrophy has {rod_cone.phenologs} phenologs. Most are mouse retina. Some are in a worm with no eyes."
    figure: nonobvious
    notes: |
      About 1.5 minutes. The emergent-property slide.
      Same human phenotype. Mouse retina degeneration is what you would expect.
      Zebrafish kinked notochord: 17 shared families. Worm osmotic avoidance defective and ivermectin resistant:
      8 and 7 shared families. No semantic similarity search would connect these.
      Why: a gene's molecular function is conserved, the organism-level phenotype is not. The phenotype is an
      emergent property of the system the gene sits in (McGary et al. 2010, Introduction).
      Interpretation to say out loud: here the shared module is the cilium. Photoreceptor outer segments are modified
      cilia; the worm's other phenologs for this term include cilia morphology variant, intraflagellar transport
      variant and dye filling defect. CHECK you are happy with the cilium framing before presenting.

  - id: history
    skip: true                   # the three papers are on the mcgary slide now
    kind: figure
    section: "What is a phenolog"
    title: "Phenologs since 2010"
    lede: "A repurposed drug in 2012, a gene predictor in 2013, and now a rebuild on the Monarch KG."
    figure: history
    notes: |
      About 1 minute. What happened to the idea.
      Cha et al. 2012 (PLoS Biology, PMID 22927795): the yeast-angiogenesis module led to thiabendazole as a vascular
      disrupting agent.
      Woods et al. 2013 (BMC Bioinformatics, PMID 23800157): pool a phenotype's k nearest phenologs and rank the genes
      they nominate, with a naive Bayes or an additive score; leave-one-out cross validation.
      Then the idea went quiet while the data kept growing. That is what we picked up.
      Two flavours. Classical: phenotype against phenotype (the last slides). Disease-framed: a disease is just a gene
      set, so the same test runs on a Mondo disease. The rest of the talk uses the disease flavour.

  - id: derivation
    skip: true                   # the Bardet-Biedl version of the one-phenolog walk-through; the concept slide uses rod-cone dystrophy
    kind: figure
    section: "What is a phenolog"
    title: "The same test, framed on a disease"
    lede: "A disease is just another gene set: Bardet–Biedl syndrome against mouse retina degeneration."
    figure: derivation
    notes: |
      About 1 minute. How one disease phenolog is derived, with the real numbers (preprint Fig. 1B).
      26 Bardet-Biedl genes collapse to 26 PANTHER families. Mouse retina degeneration has 115 genes in 97 families.
      13 families are shared, out of 7,394 present in both species: P = 1.3e-18.
      Why families: gene families expand unevenly across species (one human gene can have many mouse co-orthologs),
      so we compare at the family level and resolve back to genes later.
      A pair is kept only if it passes the species-specific 5% FDR cutoff; for human-mouse that is P <= 2.7e-4.

  - id: tree
    skip: true                   # the Bardet-Biedl version of the tree; rodcone_tree is the one in the talk
    kind: figure
    section: "What is a phenolog"
    title: "One disease against every model phenotype"
    lede: "{bbs.phenologs} phenologs in three species. Mouse reads like the clinic; the strongest hits do not."
    figure: bbs_tree
    notes: |
      About 1.5 minutes.
      Run that test for Bardet-Biedl syndrome against every phenotype in every species: 109 significant phenologs,
      62 mouse, 45 zebrafish, 2 worm.
      Mouse: retina degeneration, obese, absent sperm flagellum, kidney cyst, polydactyly. That is the clinical
      picture of the syndrome, recovered from gene overlap alone.
      Zebrafish: gastrulation disrupted and kinked notochord are the strongest phenologs of all (1e-27, 5e-26),
      plus Kupffer's vesicle and melanosome transport. Worm: osmotic avoidance defective, ivermectin resistant.
      None of those resemble the human disease; all of them are ciliary readouts in that organism.
      Rat, frog, fission yeast and slime mold have no phenolog for this disease at 5% FDR.

  - id: dataset
    skip: true                   # the networks slide is back in the opening (id: networks); this is the version with orthology arcs
    kind: figure
    section: "At knowledge-graph scale"
    title: "One knowledge graph: human and seven model species"
    lede: "Orthology, from PANTHER, is the only thing that connects the eight networks."
    figure: kg_networks_orthology
    notes: |
      About 1 minute. What the data set is.
      Each cluster is a gene-phenotype network: circles are genes, squares are phenotypes (or diseases, for human).
      Human has {human.gene_disease_pairs:,} gene-disease edges and {human.phenotype_annotations:,} gene-phenotype edges.
      The seven model species together carry {totals.model_annotations:,} gene-phenotype annotations
      on {totals.model_genes_with_phenotypes:,} genes: decades of systematic mutagenesis and phenotyping.
      Cluster size follows annotation depth: mouse and fission yeast are deep, frog and slime mold are shallow.
      The species sit in order of divergence from human, 87 million years to about 1.3 billion.
      The dashed arcs are the only thing that connects the networks: gene orthology, from PANTHER.
      Monarch collates all of this under one data model. The question is how to use it.

  - id: bbs
    skip: true                   # round 1 (2026-11-16): merged with the old slide 4 into bbs_gaps
    kind: figure
    section: "The problem"
    title: "Example complex disease: Bardet–Biedl syndrome"
    lede: "An autosomal recessive ciliopathy: about {bbs.prevalence} people, up to {bbs.prevalence_isolated} in isolated populations."
    figure: bbs_overview
    notes: |
      About 1 minute.
      Autosomal-recessive ciliopathy, roughly {bbs.prevalence}. Retinal dystrophy, obesity, postaxial polydactyly,
      chronic kidney disease, hypogonadism, cognitive impairment. The Monarch KG annotates {bbs.phenotypes_known} HPO phenotypes
      to the disease, so it touches most organ systems.
      At least 24 genes in the literature (Niederlova 2019); {bbs.known_genes} in the Monarch KG. Sequencing all of them still
      leaves about 1 in 5 clinically diagnosed patients without an identifiable pathogenic variant
      (Forsythe and Beales 2013; Perea-Romero 2022).
      The list of causal and modifier genes is incomplete, so a ranked list of candidates is a clinical need here,
      and we will come back to this disease at every step.

  - id: gaps
    skip: true                   # round 1 (2026-11-16): merged with the old slide 3 into bbs_gaps; gaps_backup is the copy in backup
    kind: figure
    section: "The problem"
    title: "Model organism gene–phenotype information\nmay help fill in the gaps"
    figure: fill_gaps
    notes: |
      About 1 minute. The turn from the problem to an idea for it.
      On the left, seven model organisms, each a curated network: circles are genes, squares are the phenotypes
      those genes give when perturbed. On the right, what we care about: human diseases and human phenotypes, the
      terms a patient like the Bardet-Biedl patient is described with.
      The bars: {totals.model_annotations:,} non-human gene-phenotype edges, all seven species together (the colours
      are the species), against {human.phenotype_annotations:,} human gene-phenotype edges and only
      {human.gene_disease_pairs:,} human gene-disease edges.
      The core idea of phenologs: can decades of gene-phenotyping in model organisms tell us about human disease
      biology? That is the question mark.
      How can we leverage this information? We need a way to compare these networks across species and get
      something meaningful out. One way has been around since 2010: next slide.

  - id: eval_results_old
    skip: true                   # round 1 (2026-11-16): the one-slide version with the three boxes on the right
    kind: figure
    section: "Evaluation"
    title: "It predicts links it has never seen"
    lede: "The top 100 candidates per disease recover 9 of {evaluation.genuine} new pairs: 23.5 times a random gene."
    figure: eval_results_tiles
    notes: |
      About 2 minutes (preprint Fig. 3).
      Left panel, per disease: recall of the 73 pairs within each disease's top N. Top 10: 2 (52x random). Top 20: 3.
      Top 100: 9 of 73, 23.5-fold over a random gene, 95% CI 10.5 to 39.2, permutation P = 2e-4.
      The ceiling is 41 of 73: the rest never surface in any candidate list.
      Within a disease hg and naive Bayes are indistinguishable (P = 0.32). Expected: same candidate pool.
      Right panel, everything pooled into one list: only hg separates from random ordering (AUC 0.58 against 0.45).
      In the top 10,000 pooled pairs, 0.7% of the list, 4 confirmed against 0.3 expected.
      One genuinely prospective hit: FAAP100 for Fanconi anemia. Absent from the 2025 graph, ranked near the top on
      mouse phenologs alone, human link first reported April 2025.
      Next: what the ranking looks like for one disease. The second kind of test, on the genes we already know
      (leave-one-out and precision-recall), is the first two backup slides.

