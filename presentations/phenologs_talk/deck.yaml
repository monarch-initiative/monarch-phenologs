    figure: time_split_simple
    figure_dy: 0.094              # the lede runs to two lines
    notes: |
      About 1 minute. Disease-gene discovery is continuous, so two versions of the graph a year apart give a
      natural test.
      Compute phenologs and score candidate genes on Monarch KG {meta.kg_prior}. Then take the gene-disease pairs
      that Monarch KG {meta.kg_release} added: {evaluation.genuine} evaluable pairs across {evaluation.genuine_diseases} diseases.
      For each new pair, look up the gene in that disease's 2025 candidate list. The count on the next slide is how
      many of the {evaluation.genuine} fall within the top N candidates, for naive Bayes and the hypergeometric score,
      against a random gene.
      If asked why {evaluation.genuine}: {evaluation.new_pairs} pairs were added in all. {evaluation.not_testable} are on diseases that had no gene a
      year earlier, so no phenolog could exist for them, and {evaluation.redundant} are the same gene moving to a parent, child or
