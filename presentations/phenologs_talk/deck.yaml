  - id: networks
    kind: figure
    section: "Backup"
    title: "Curated gene–phenotype networks in the Monarch KG"
    lede: "Human and seven model organisms, each a separate network of genes and their phenotypes."
    figure: kg_networks
    notes: |
      About 1 minute. This is the turn from the problem to what our lab works on: using curated model-organism
      data for human health.
      The Monarch knowledge graph collects curated gene-phenotype data for human and seven model organisms under
      one data model. Think of each species as its own network: circles are genes, squares are phenotypes (or
      diseases, for human), and a line is a curated edge: this gene, when perturbed, gives this phenotype.
      Human has {human.phenotype_annotations:,} gene-phenotype edges and {human.gene_disease_pairs:,} gene-disease edges.
      Mouse alone has {sp.mouse.annotations:,} gene-phenotype edges, fission yeast {sp.pombe.annotations:,}, zebrafish {sp.zebrafish.annotations:,}:
      decades of mutants, knockouts and screens, curated by the model-organism databases.
      Cluster size follows the number of edges: mouse and fission yeast are deep, frog and slime mold are shallow.
      The species sit in order of divergence from human, 87 million years to about 1.3 billion.
      For now these are separate networks. Nothing on this slide connects a mouse phenotype to a human one.

