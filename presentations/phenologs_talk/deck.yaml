# The talk, slide by slide. Words live here; numbers live in data.yaml; pictures in figures*.py.
#
# Text may quote data.yaml with {path.to.value}: {totals.disease_phenologs:,} -> 61,243,
# {bbs.best_p!p} -> 9.6 × 10⁻²⁸. Reorder, drop or add slides by editing this list.
#
# kinds
#   cover     title slide
#   divider   section break (style: carolina | navy | white)
#   figure    title + one-sentence lede + a figure from figures*.py. `steps` shows one figure in builds.
#   cards     title + lede + editable text cards
#   stats     title + big-number tiles
#   columns   title + two text columns
#   end       the template's closing slide
#
# `notes` become speaker notes. `skip: true` leaves a slide out without deleting it.
# Optional layout keys, for a slide that was adjusted by hand in PowerPoint:
#   title_size: 20                    title in points (28 otherwise)
#   lede_size: 15                     lede in points (17 otherwise)
#   lede_box: [x, y, width]           where the lede sits, in inches
#   title_box: [x, y, width, height]  where the title sits, in inches
#   figure_dy: 0.1                    move the figure down (or up, when negative), in inches

meta:
  title: "Phenologs at knowledge-graph scale"
  cover_title: "Phenologs at\nknowledge-graph scale"     # where the cover's title breaks
  subtitle: "Candidate genes for thousands of human diseases, from mouse to slime mold"
  presenter: "Aaron Odell · Department of Genetics · UNC Chapel Hill"
  date: "Monarch Initiative · 2026"
  footer: "Odell et al. 2026 · bioRxiv · doi:{meta.doi}"
  out: "phenologs_talk"

slides:
  # ------------------------------------------------------------------------------------------
  # The talk
  # The order is the deck's as rearranged by hand on 2026-11-16 (kept in hand_edited/), with the round 1 edits
  # from Notion ("Presentation edits round1", 2026-11-16) applied on top.
  # ------------------------------------------------------------------------------------------
  - id: cover
    kind: cover
    notes: |
      20 to 25 minutes. The problem and the idea of a phenolog; Part 1, phenologs rebuilt on the Monarch KG;
      Part 2, from phenologs to ranked candidate genes and how we tested them; then what comes next.
      Bardet-Biedl syndrome opens the talk and comes back when candidates are ranked.

  - id: problem
    kind: figure
    section: "The problem"
    title: "Many rare disease patients still go undiagnosed"
    figure: diagnostic_gap
    notes: |
      About 1 minute.
      Even with exome or genome sequencing in hand, roughly half to 70 percent of rare-disease patients still have
      no molecular diagnosis (diagnostic yield is about {problem.yield_low} to {problem.yield_high} percent, varying by cohort).
      Several reasons: the variant is hard to detect, it is found but cannot be interpreted, the gene has not been
      linked to the disease yet, or the cause is not purely genetic (environment, gene-environment interaction).
      This talk is about the third one: we do not know all the disease genes. Many likely-monogenic diseases have
      no causal gene at all, and diseases with many known genes can still have more.
      Where the number comes from (printed bottom left): Chung et al. 2023, Genet Med 25:100896, a meta-analysis of
      161 studies and 50,417 probands, pooled diagnostic yield 38% for exome and 34% for genome; Clark et al. 2018,
      npj Genom Med 3:16, 37 studies in children, 41% genome and 36% exome. So about 59 to 66% undiagnosed pooled.
      Large single cohorts run from 59% (DDD, Wright 2023 NEJM) to 75% (100,000 Genomes pilot, 2021 NEJM).
      "More than half" is the safe way to say it.

  - id: bbs_gaps
    kind: figure
    section: "The problem"
    title: "Model organism gene–phenotype information\nmay help fill in the gaps"
    figure: bbs_fill_gaps
    notes: |
      About 2 minutes. Slides 3 and 4 as one (round 1 edits): the example disease and what is missing on the left,
      where help could come from on the right.
      Left. Bardet-Biedl syndrome: an autosomal-recessive ciliopathy, roughly {bbs.prevalence}, up to
      {bbs.prevalence_isolated} in isolated populations. Retinal dystrophy, obesity, postaxial polydactyly, chronic kidney
      disease, hypogonadism, cognitive impairment. The Monarch KG annotates {bbs.phenotypes_known} HPO phenotypes to the
      disease, so it touches most organ systems.
      At least 24 genes in the literature (Niederlova 2019); {bbs.known_genes} in the Monarch KG. Sequencing all of them still
      leaves about 1 in 5 clinically diagnosed patients without an identifiable pathogenic variant
      (Forsythe and Beales 2013; Perea-Romero 2022).
      The list of causal and modifier genes is incomplete, so a ranked list of candidates is a clinical need here,
      and we will come back to this disease at every step.
      Right. Seven model organisms, each a curated network: circles are genes, squares are the phenotypes those
      genes give when perturbed.
      The bars: {totals.model_annotations:,} non-human gene-phenotype edges, all seven species together (the colours
      are the species), against {human.phenotype_annotations:,} human gene-phenotype edges and only
      {human.gene_disease_pairs:,} human gene-disease edges.
      The question mark is the core idea of phenologs: can decades of gene-phenotyping in model organisms tell us
      about a human disease like this one?
      How can we leverage this information? We need a way to compare these networks across species and get
      something meaningful out. One way has been around since 2010: next slide.
      The two slides this one replaces (ids bbs and gaps) are parked in deck.yaml; the old slide 4 is also in backup.

  - id: mcgary
    kind: figure
    section: "The problem"
    title: "Phenologs: an idea from 2010"
    lede: "The term “phenologs” was coined in 2010 and a method was published, discovering new candidate human disease genes and identifying a new drug application"
    figure: phenolog_papers
    figure_dy: 0.094              # the lede runs to two lines, as on the naive Bayes slide
    notes: |
      About 1 minute. The last slide asked how model organism data can be used for human disease. One answer is
      not ours: it comes from Edward Marcotte's lab at UT Austin, in three papers.
      McGary et al. 2010, PNAS (PMID {history.mcgary2010.pmid}): defined phenologs and found them systematically across
      five species (human, mouse, worm, yeast, Arabidopsis). The title says "nonobvious": yeast lovastatin sensitivity
      matched mouse angiogenesis defects, and plant gravitropism defects matched Waardenburg syndrome, each with a
      new gene confirmed in frog embryos (SOX13, SEC23IP).
      Cha et al. 2012, PLoS Biology (PMID {history.cha2012.pmid}): the yeast-angiogenesis module led to thiabendazole, an
      antifungal, as a vascular disrupting agent.
      Woods et al. 2013, BMC Bioinformatics (PMID {history.woods2013.pmid}): pooled a phenotype's nearest phenologs to rank
      candidate genes, with leave-one-out cross validation.
      The definition. A phenolog is an orthologous phenotype: two phenotypes in different species that share
      significantly more orthologous genes than expected by chance. The quote is the paper's own wording
      (Results and Discussion). Note what the definition does not mention: what the phenotypes look like.
      Next: the idea as one picture, and the example the 2010 paper is remembered for.

  - id: idea
    kind: figure
    section: "The problem"
    title: "Phenologs: comparing gene-networks across species"
    lede: "Decades of model organism gene–phenotype data can be linked to human disease through gene orthology."
    figure: phenolog_idea
    notes: |
      About 2 minutes. The idea of the 2010 paper, close to first principles. Left first, then the example.
      Left. Model organisms have decades of mutants, knockouts and screens behind them. Each species is a curated
      network: circles are genes, open squares are the phenotypes those genes give when perturbed. In 2010 that was
      {history.mcgary2010.associations.mouse:,} associations for mouse, {history.mcgary2010.associations.worm:,} for worm, {history.mcgary2010.associations.yeast:,} for budding yeast and
      {history.mcgary2010.associations.arabidopsis:,} for Arabidopsis.
      The human network in the middle is gene to disease (filled squares), from OMIM: {history.mcgary2010.associations.human:,} associations over
      about {history.mcgary2010.human_diseases_approx} diseases. The four model organisms together had about 110 times more (210,619).
      That is the gap they wanted to borrow across.
      The networks cannot be compared by what the phenotypes look like: a yeast has no blood vessels, a plant has no
      neural crest. They can be compared by gene. Orthology (dashed) says which genes are equivalent between two
      species. So take every pair of one model phenotype and one human disease, and ask whether the two share more
      orthologous genes than chance allows. If they do, they are phenologs: one gene module read out in two organisms.
      The number on each link is how many phenologs with human disease they found at 5% FDR: 3,755 for mouse,
      9 for worm, 154 for yeast, 48 for Arabidopsis.
      Right. One of the 48 human-plant ones, the paper's Fig. 4.
      Waardenburg syndrome: a neural crest disorder (abnormal pigmentation, hearing loss, craniofacial dysmorphology).
      Counting only genes with a plant ortholog, it had {history.mcgary2010.waardenburg.human_genes} known genes.
      Negative gravitropism defects in Arabidopsis: shoots that fail to grow against gravity. {history.mcgary2010.waardenburg.plant_genes} genes.
      {history.mcgary2010.waardenburg.shared} are shared. That leaves {history.mcgary2010.waardenburg.candidates} plant genes, all vesicle trafficking genes, and their human orthologs become
      candidate Waardenburg genes: STX7/STX12, DDHD2/SEC23IP and DNAJC13. This is guilt by association.
      They tested them in Xenopus embryos. sec23ip turned out to be expressed in migrating neural crest cells.
      Knocking it down with a morpholino on one side of the embryo gave neural crest migration defects on that side
      in {history.mcgary2010.waardenburg.defect[0]} of {history.mcgary2010.waardenburg.defect[1]} embryos, against {history.mcgary2010.waardenburg.control[0]} of {history.mcgary2010.waardenburg.control[1]} untreated controls.
      So a plant, which has no neural crest, pointed to a neural crest gene. That is the "nonobvious" in the title.
      Next: the same kind of data today, in the Monarch knowledge graph.
      If asked. They also compared the model organisms with each other: more than 6,200 phenologs in all. The worm
      number is low because both data sets were small. Orthologs were pairwise ortholog groups with in-paralogs
      (Remm et al. 2001). STX12 already had support: it interacts with pallid, a mouse pigmentation and ear gene.
      The 23 of 35 is with the snai2-a marker; with twist it was {history.mcgary2010.waardenburg.defect_twist[0]} of {history.mcgary2010.waardenburg.defect_twist[1]}. The embryo drawings are schematic.

  - id: part1
    kind: divider
    style: carolina
    label: "PART 1 · Monarch knowledge graph for phenologs"
    title: "Revitalize phenologs with more data using the Monarch Knowledge graph"
    notes: |
      The idea is from 2010. What has changed since is the data and where it lives: the Monarch knowledge graph holds
      human and model organism gene-phenotype data under one model. Part 1: what a phenolog calculation takes from
      the graph, how much more of it there is now, how one phenolog is computed, and what comes out.

  - id: kg_components
    kind: figure
    section: "Phenologs on the Monarch KG"
    title: "Monarch KG for phenolog calculations"
    figure: kg_components
    notes: |
      About 1.5 minutes. The last slide was the idea as the earlier papers laid it down. This one asks what it
      looks like in practice: which parts of the Monarch knowledge graph do we actually pull?
      Three things, one column each. Top of a column: the pattern in the graph. Middle: what is in it.
      Bottom: the Biolink categories that select it (the same symbols as the pattern above).
      Human. Two networks around one set of genes, HGNC ids. Gene-disease: {human.gene_disease_pairs:,} edges to
      {human.diseases_with_gene:,} Mondo diseases, causal and correlated associations together. Gene-phenotype:
      {human.phenotype_annotations:,} edges to {human.phenotype_terms:,} HPO terms.
      Model organisms. One gene-phenotype network per species, {totals.model_annotations:,} edges in all, each in the
      species' own phenotype ontology and with its own database's gene ids: MP for mouse and rat (MGI, RGD),
      XPO for frog (Xenbase), ZP for zebrafish (ZFIN), WBPhenotype for worm (WormBase), FYPO for fission yeast
      (PomBase), DDPHENO for slime mold (dictyBase). These are the only species with gene-phenotype edges in the graph.
      Gene equivalence. Gene-to-gene orthology edges from PANTHER. Every one carries a PANTHER protein family id,
      and that id is what we compare on: {human.genes_with_ortholog:,} human genes with an ortholog fall into {human.families:,} families.
      The small numbers are the families each species shares with human, the universe for that species' tests
      ({sp.mouse.families_shared:,} for mouse, down to {sp.pombe.families_shared:,} for fission yeast).
      Why Biolink matters: one data model means one query pattern pulls all of this, with no per-database parsing.
      Next: how much more data that is than the earlier papers had.
      If asked. Predicates: gene to phenotype is biolink:has_phenotype; causal gene to disease is
      {kg.biolink.causal_predicates}; correlated is
      {kg.biolink.correlated_predicates}. Orthology edges are kept only when their evidence
      is a PANTHER family. Term filters: Mondo terms under "human disease", HPO terms under "phenotypic
      abnormality", FYPO terms under "abnormal phenotype" (preprint Tables S1 to S3). KG release {meta.kg_release}.
      The table counts every term annotated in a species ({sp.mouse.phenotype_terms:,} for mouse); the {comparisons.mouse.phenotypes:,} on the "Phenologs conceptualized"
      slide are the mouse terms that can be tested against human (at least one gene in a shared family).
      The {human.diseases_with_gene:,} diseases is the dashboard's count of diseases with a gene; the preprint's Fig. 1A says 7,935.

  - id: then_now
    kind: figure
    section: "Phenologs on the Monarch KG"
    title: "Then and now: the data behind phenologs"
    lede: "When phenologs were last computed, only a fraction of today's curated annotations existed."
    figure: then_now
    notes: |
      About 1 minute.
      The method worked in 2010 to 2013, on a fraction of the data we have today.
      2010 (McGary et al.): five species; about 300 human diseases with {history.mcgary2010.associations.human:,} gene-disease associations from OMIM;
      no human phenotype annotations at all; 210,619 model organism gene-phenotype associations (mouse 74,250,
      worm 27,065, yeast 86,383, Arabidopsis 22,921).
      Now: eight species; {human.diseases_with_gene:,} Mondo diseases with a gene and {human.gene_disease_pairs:,} gene-disease annotations;
      {human.phenotype_terms:,} HPO phenotypes with {human.phenotype_annotations:,} gene-phenotype annotations, which did not exist as a
      data set then; {totals.model_annotations:,} model organism gene-phenotype annotations.
      Methodological differences. 2010 and 2013: annotations assembled by hand from each source database, and gene
      homology computed per study with InParanoid. 2026: the Monarch KG and the Biolink model harmonize the
      annotation sets, and PANTHER protein families resolve gene equivalence across species.
      Caveats if asked: the "then" bars are the 2010 paper's numbers as stated in its text; Woods et al. 2013
      added species and updated OMIM but does not state totals. Disease counts are like for like only roughly
      (OMIM then, Mondo now, which includes grouping terms).
      Next: how one phenolog is computed, on one of the species comparisons, human against mouse.

  - id: concept
    kind: figure
    section: "Phenologs on the Monarch KG"
    title: "Phenologs conceptualized"
    lede: "A way to compare two different species' gene-association networks through gene orthology"
    figure: phenolog_concept
    notes: |
      About 2.5 minutes. Top half first, then the bottom half.
      Top. Two of the networks: the human gene-phenotype network
      ({human.phenotype_terms:,} HPO terms) and the mouse gene-phenotype network ({comparisons.mouse.phenotypes:,} terms). Phenologs compare them
      term by term, every human phenotype against every mouse phenotype: a grid of about 96 million pairs.
      Almost every pair shows nothing. A few overlap far beyond chance (the orange cells): those are phenologs.
      The same grid is built for each of the seven model organisms, and again with human diseases in place of
      human phenotypes ({comparisons.mouse.diseases:,} diseases against mouse: {comparisons.mouse.tests:,} pairs, preprint Table S4).
      The 96 million is {human.phenotype_terms:,} times {comparisons.mouse.phenotypes:,}; {human.phenotype_terms:,} counts HPO terms with a gene that has an ortholog in
      any of the seven species, so for mouse alone it is a slight upper bound. Hence the "about".
      Bottom. The ringed cell of that grid. Rod-cone dystrophy, a human phenotype, has {rod_cone.derivation.genes} genes (RHO, PDE6B, CRB1...).
      Mouse retina degeneration has {rod_cone.derivation.phenotype_genes}. To compare them we have to say which human gene is the same gene as
      which mouse gene, and orthologs are often not one to one. So every gene is replaced by its PANTHER protein
      family: {rod_cone.derivation.families} families on the human side, {rod_cone.derivation.phenotype_families} on the mouse side.
      {rod_cone.derivation.shared} families are shared, of {rod_cone.derivation.N:,} the two species have in common. Hypergeometric P = 3.8e-45.
      That overlap makes the two phenotypes phenologs.
      Guilt by association: because the link is gene overlap, it predicts. The 57 families tied to the mouse
      phenotype but not yet to the human one become candidates for rod-cone dystrophy. Those 57 families are
      {rod_cone.derivation.mouse_only_genes} mouse genes, each with one human ortholog, so {rod_cone.derivation.mouse_only_genes} human candidate genes from this one phenolog
      ({rod_cone.derivation.mouse_only_examples} are among them). The reverse holds for the 100 human-only families and the mouse phenotype.
      Detail if asked: {rod_cone.derivation.phenotype_genes_with_family} of the 115 mouse genes have a PANTHER family; the rest are unmapped loci.
      Numbers: dashboard, HP:0000510 against MP:0001326. Which pairs count as significant: a 5% FDR from 1,000
      randomized networks.

  - id: rodcone_tree
    kind: figure
    section: "Phenologs on the Monarch KG"
    title: "An example human phenotype term compared against 7 model organisms"
    title_size: 22                # the title is long: 28 pt would wrap onto the lede
    lede: "{rod_cone.phenologs} significant hits against human Rod-cone dystrophy"
    figure: rodcone_tree
    notes: |
      About 2 minutes.
      Run that test for rod-cone dystrophy against every phenotype in every species: {rod_cone.phenologs} phenologs,
      {rod_cone.by_species.mouse} in mouse, {rod_cone.by_species.zebrafish} in zebrafish, {rod_cone.by_species.worm} in worm. Rat, frog, fission yeast and slime mold have none at 5% FDR.
      Ten are shown, strongest first within each species.
      Mouse: retina degeneration, abnormal photoreceptor outer segment morphology, abnormal rod electrophysiology.
      Semantically similar: eye to eye. A text or ontology match would find these too.
      Zebrafish: there are retina phenotypes, but the two strongest are kinked notochord and cystic pronephros.
      Worm: osmotic avoidance defective, cilia morphology variant, ivermectin resistant. A worm has no retina.
      Nothing in the words connects these to a human eye phenotype. Only the genes do.
      Why: a gene's molecular function is conserved, the organism-level phenotype is not. The phenotype is an
      emergent property of the system the gene sits in (McGary et al. 2010).
      Interpretation to say out loud: the shared module here is the cilium. Photoreceptor outer segments are
      modified cilia; the worm senses its surroundings through ciliated neurons, and fish kidney and body-axis
      phenotypes are classic ciliary readouts. CHECK you are happy with the cilium framing before presenting.
      So one method gives both: the counterparts we expect, and new links we could not have guessed.
      Which phenologs are drawn as "semantically similar" is my labelling (`obvious` under rod_cone.tree in data.yaml).
      The text of the two cards is rod_cone.similar_text and rod_cone.nonobvious_text in data.yaml.

  - id: counts
    kind: figure
    section: "Phenologs on the Monarch KG"
    title: "Initial results"
    figure: counts
    figure_dy: -0.245             # no lede: the figure was moved up by hand
    notes: |
      About 1 minute.
      Disease network: {totals.disease_phenologs:,} phenologs across {totals.diseases_with_phenologs:,} Mondo diseases and
      {totals.model_phenotypes_with_diseases:,} model phenotypes. 82% of those diseases are leaf terms, so this is breadth
      across the ontology, not a few broad classes.
      Mouse supplies 84.5%, tracking annotation depth, but zebrafish, worm, fission yeast and even slime mold contribute.
      Phenotype network (HPO terms instead of diseases): {totals.phenotype_phenologs:,} phenologs across
      {totals.hp_terms_with_phenologs:,} HPO terms and {totals.model_phenotypes_with_hp:,} model phenotypes. We have barely
      scratched that one; it comes back under future directions.
      Last row, for scale: McGary et al. 2010 found 3,966 phenologs with human disease across their four model
      organisms (mouse 3,755, yeast 154, Arabidopsis 48, worm 9), so about 15 times fewer than the disease network
      here. Their total of more than 6,200 also counts model organism against model organism.

  - id: part2
    kind: divider
    style: carolina
    label: "PART 2 · FROM PHENOLOGS TO CANDIDATE GENES"
    title: "Phenologs nominate many gene candidates. We need a way to score them"
    notes: |
      There is a second layer to the problem. Finding phenologs is step one.
      Turning a disease's phenologs into a ranked list of genes is step two, and how you score matters.

  - id: pooling
    kind: figure
    section: "Candidate genes"
    title: "Phenologs can nominate thousands of genes per disease"
    lede: "Bardet–Biedl syndrome's {bbs.phenologs} phenologs nominate {bbs.genes_ranked:,} genes. Scoring these genes is the second half of the method"
    lede_size: 15                 # one line at 15 pt; at 17 pt it wraps onto the figure
    figure: pooling
    notes: |
      About 1 minute (preprint Fig. 1C; the three panels follow that figure).
      Panel 1: take the disease's significant phenologs, up to k = 1,000 (Bardet-Biedl has 109).
      Panel 2: map every model gene carrying those phenotypes back to its human orthologs, and count how many of the
      109 phenologs each human gene turns up in. BBS1 turns up in 50 of 109, CEP290 in 42.
      Panel 3: what we want out is a ranked list of candidate genes. The score column is question marks on purpose:
      the next two slides are about how to fill it in.
      Recurrence alone is not the score. Look at the order: MKKS recurs in 32 phenologs and ranks above BBS4 with 41,
      and CEP290 with 42 is sixth, outside the top five. Some genes are annotated to hundreds of phenotypes and recur
      everywhere.
      IFT140 and ARL2BP are not known Bardet-Biedl genes; they recur in 21 and 14 phenologs and rank 12th and 14th.
      Bottom strip: three ways to turn recurrence into a score. Naive Bayes and additive from the earlier papers, and
      the hypergeometric score we introduce.
      The ranks shown are the ones the hypergeometric score gives at k = 1,000.

  - id: naive_bayes
    kind: figure
    section: "Candidate genes"
    title: "Gene-disease scoring, the original way: naive Bayes"
    lede: "The probability of the initial phenolog association being true, multiplied by the fraction of the disease's known gene families that phenolog shares"
    figure: naive_bayes
    figure_dy: 0.094              # the lede runs to two lines: the figure was moved down by hand
    notes: |
      About 1.5 minutes. Keep it simple.
      Each phenolog carrying the gene contributes a weight: the fraction of the disease's families the phenotype
      shares, times our confidence that the phenolog is real (1 minus its P, effectively 1 here).
      Naive Bayes treats phenologs as independent: the probability the gene belongs to the disease is 1 minus the
      probability that every phenolog is wrong. Three witnesses at 0.54, 0.50, 0.46 give 0.88.
      Additive (Woods 2013) just sums the weights. Its advantage is that it decomposes by phenolog, which is how the
      stacked-bar figures in the paper and on the dashboard are drawn (backup slide).
      Limits: the product saturates toward 1 as k grows, and the score is relative to one disease, so you cannot
      merge candidates from different diseases into one list. (These two points were lines at the bottom of the
      slide until round 1; say them.)
      The lede follows the code: each phenolog's weight is (1 - P) times shared families over the disease's
      families (phenologs_utils.py, the naive Bayes product), so the second factor is not a per-gene probability.
      The weights on the slide are computed in the build from Bardet-Biedl's real top phenologs; "gene X" is hypothetical.

  - id: hypergeom_marbles
    kind: figure
    section: "Candidate genes"
    # as typed in PowerPoint: the tabs and spaces indent the second line, which wraps on its own at this size
    title: "New scoring method: Second round hypergeometric test against backdrop of all \t\t            species gene-phenotype edges"
    title_size: 20
    figure: marbles
    notes: |
      The main score explainer: one real gene, {bbs.score_example.gene}, worked through {bbs.label}. Every number on
      the slide is the release's own. About 2 minutes.
      1. Pool the annotations: the bag. Every gene-phenotype annotation in the seven model species is one marble:
      {bbs.score_example.bag:,} of them. The three lines at the top are real annotations (mouse, zebrafish, worm).
      {bbs.score_example.gene}'s mouse ortholog {bbs.score_example.ortholog} is annotated to {bbs.score_example.own}
      mouse phenotypes, so {bbs.score_example.gene} owns {bbs.score_example.own} marbles. Only annotations of genes
      in a protein family shared with human are in the bag.
      2. Sample from the bag via phenologs. This is the phenolog table from two slides ago (the paper's Fig. 1C):
      {bbs.label}'s {bbs.phenologs} significant phenologs, ranked by P. The new column is the marbles each one
      draws: every gene annotated to that model phenotype. The three annotations from panel 1 are on this list:
      notochord kinked is phenolog 2, male infertility is phenolog 20 and carries {bbs.score_example.ortholog}'s
      marble (the orange one), osmotic avoidance defective is phenolog 81. Male infertility is a broad phenotype,
      so it draws 1,027 marbles on its own.
      All {bbs.phenologs} phenologs pool into {bbs.score_example.pulled:,} marbles, spread across
      {bbs.genes_ranked:,} candidate genes. {bbs.score_example.drawn} of them are {bbs.score_example.gene}'s: it is
      on {bbs.score_example.drawn} of the {bbs.phenologs} phenologs, the "14 of 109" from the pooling slide.
      3. Test the significance. Read the four numbers top to bottom. The bag holds {bbs.score_example.bag:,}
      marbles and {bbs.score_example.own} are {bbs.score_example.gene}'s. We drew {bbs.score_example.pulled:,} and
      {bbs.score_example.drawn} are {bbs.score_example.gene}'s.
      To say out loud, not on the slide: we drew 1.6% of the bag, so a random draw that size would hold 1.6% of
      {bbs.score_example.gene}'s {bbs.score_example.own} marbles, about 0.6. We drew {bbs.score_example.drawn},
      24 times more.
      The score is the chance of drawing that many or more at random, the upper tail of the hypergeometric
      distribution: 2.0 x 10^-16, rank 14 of {bbs.genes_ranked:,} (the rank is not on the slide; say it). Smaller is stronger. It is the test behind gene
      set over-representation (GO enrichment), pointed at one gene.
      {bbs.score_example.gene} is not a known {bbs.label} gene; it is known for
      {bbs.score_example.known_for}.
      If asked for the symbols (Supplementary Note 5), panel 3 top to bottom is N = {bbs.score_example.bag:,},
      m = {bbs.score_example.own}, n = {bbs.score_example.pulled:,} ("the genes we originally pulled in from our top
      k phenologs"), c = {bbs.score_example.drawn}; score = P(X >= c). These four numbers reproduce the published
      score for this gene and for six others checked. n is the marbles drawn, not the number of phenologs.
      If asked whether the draw is really random: no. It is every gene on {bbs.phenologs} chosen phenotypes. The
      random draw is the null model the score compares against.
      Detail: a gene with two orthologs annotated to the same phenotype is counted twice there. That is 44 of the
      {bbs.score_example.pulled:,} marbles here, and none of {bbs.score_example.gene}'s.
      The bag and the tray are schematic; the numbers are bbs.score_example in data.yaml. The marble counts per
