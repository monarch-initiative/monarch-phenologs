  - id: eval_results
    kind: figure
    section: "Evaluation"
    title: "It predicts links it has never seen"
    lede: "The top 100 candidates per disease recover 9 of {evaluation.genuine} new pairs: 23.5 times a random gene."
    figure: eval_results
    steps:                        # three slides, each adding to the last: click through, no animation
      - {step: 1}                 # within a disease
      - {step: 2}                 # + pooled across diseases
      - {step: 3}                 # + the cross-validation note
    notes: |
      About 2 minutes (preprint Fig. 3). Three clicks: the left plot, then the right plot, then the note.
      Click 1, within a disease. The point of view: a disease is going to gain a new gene, and we ask whether that
      gene was among the disease's top N candidates a year earlier. Recall of the 73 pairs within each disease's
      top N. Top 10: 2 (52x random). Top 20: 3. Top 100: 9 of 73, 23.5-fold over a random gene, 95% CI 10.5 to 39.2,
      permutation P = 2e-4. The ceiling is 41 of 73: the rest never surface in any candidate list.
      Within a disease hg and naive Bayes are indistinguishable (P = 0.32). Expected: same candidate pool.
      Click 2, pooled across diseases. A different point of view: no disease chosen in advance, every candidate
      pair from every disease in one ranked list. Only hg separates from a random ordering (AUC 0.58; naive Bayes
      0.45). In the top 10,000 pooled pairs, 0.7% of the list, 4 confirmed against 0.3 expected.
      One genuinely prospective hit: FAAP100 for Fanconi anemia. Absent from the 2025 graph, ranked near the top on
      mouse phenologs alone, human link first reported April 2025. (It was a box on this slide until round 1.)
      Click 3. We also ran the test the earlier papers used, leave-one-out cross validation (Woods et al. 2013):
      hide a protein family's genes, recompute, and see where they rank. That and precision-recall on known genes
      are the backup slides.
      Next: what the ranking looks like for one disease.

  - id: bbs_model
    kind: figure
    section: "Evaluation"
    title: "Bardet–Biedl is modeled well by phenologs method"
    lede: "All {bbs.known_recovered}/{bbs.known_genes} known genes are recovered, all with ranks of {bbs.known_rank_all_but_one} or better except for one at rank {bbs.known_rank_last:,}"
    figure: bbs_decomposition
    notes: |
      About 2 minutes. The payoff: the method models a real disease, and here is how and why. Back to the running
      example from slide 3.
      The lede is the gene result (hypergeometric score, all {bbs.phenologs} phenologs): all {bbs.known_genes} known genes are in the
      list of {bbs.genes_ranked:,}, 25 of them at rank {bbs.known_rank_all_but_one} or better (22 in the top 62); the one that is not is SCAPER, at {bbs.known_rank_last:,}.
      Left: the additive decomposition, as on the dashboard and in the paper's Fig. 5, cut to the disease's ten best
      phenologs. One row per protein family, labelled with its human genes; bold is a known Bardet-Biedl gene.
      Each block is one of the ten phenologs that carries the family, numbered by the phenolog's rank. A block's
      width is the phenolog's weight: the share of the 26 known families it holds, times 1 minus its P. So 14 of 26
      is 0.54. The bar is the sum, the additive score of Woods 2013.
      The eleven longest bars are all known genes, and 13 of the top 16 families hold one. They rise to the top
      because they sit on nearly all ten phenologs, of both kinds.
      Right: what the ten phenotypes are, semantically similar on top. This is the same split as on the rod-cone slide.
      Two of the mouse ones name a term that is annotated to the disease itself in HPO: obese and Obesity, retina
      degeneration and Retinal dystrophy (two of the disease's {bbs.phenotypes_known} HPO terms; matched by meaning, I found no
      formal MP-to-HP mapping for them in the Monarch API). Further down the list the same holds for kidney cyst
      (27, Multiple renal cysts), male infertility (20, Infertility) and anosmia (37, Abnormality of the sense of smell).
      Semantically similar, all mouse: retina degeneration, obese, photoreceptor outer and inner segment
      degeneration, absent sperm flagellum. That is the patient from slide 3: retinal dystrophy, obesity,
      hypogonadism. And two of them are the cilium itself: the photoreceptor outer segment is a modified cilium and
      the sperm flagellum is built on the same axoneme. The mouse data say "ciliopathy" without being told.
      Non-obvious, all zebrafish embryo: gastrulation disrupted, notochord kinked, somite increased width, a shorter
      body axis, a wider notochord. No patient has a kinked notochord. These are five readouts of one process,
      convergent extension: the cell movements that narrow and lengthen the embryo. The disease's phenologs 16 and 17
      say so in words ("cell migration involved in gastrulation disrupted", "convergent extension process quality").
      The fish orthologs of 14 of the 26 known families are annotated to each of the top three.
      One conserved set of genes, a different emergent phenotype in each organism, and both kinds point at the same
      genes. The numbers on the right are how many of the 26 known families each phenotype shares.
      The rows without a bold gene are the candidates this view suggests. IFT140 (with the known IFT172) and IFT88
      are intraflagellar transport genes. The frizzled family (FRZB, FZD1 and 14 more) and the receptor tyrosine
      kinases (ALK, AXL and 40 more) are large families pulled in by the fish phenologs: Wnt and planar cell polarity
      signalling gives the same embryo phenotypes. Be straight about those: phenotype overlap, not claims, and this
      panel ranks whole families. The hypergeometric score ranks single genes and accounts for how widely a gene is
      annotated (the marble slide).
      Two rankings are on this slide: the lede is genes by the hypergeometric score over all {bbs.phenologs} phenologs, the bars
      are families by the additive score over the top ten. They agree on the known genes.
      If asked for literature on the fish phenotypes: Bardet-Biedl proteins and planar cell polarity (Ross et al.
      2005, Nature Genetics), and convergent extension defects on bbs1 knockdown in zebrafish. Check both references
      before quoting them; the reading of the five fish phenotypes as convergent extension is mine, and since
      round 1 it is in these notes only, not on the slide.
      Which phenotypes count as non-obvious is my labelling (`obvious` under bbs.decomposition in data.yaml), and the
      two sentences in the boxes are why_nonobvious and why_similar there.
      The gene-by-gene list of the top 25 candidates, and the paper's 20 by 20 version of this figure, are in backup.
      Next: all of this can be browsed.

