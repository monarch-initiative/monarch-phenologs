[project]
name = "monarch-phenologs"
version = "0.3.0"
description = "Phenologs and cross species gene candidate rankings from the Monarch Knowledge Graph"
authors = [{ name = "Aaron Odell", email = "aaron@tislab.org" }]
requires-python = ">=3.10,<3.13"

# Pinned to the versions the paper's runs were made with. Bump on purpose, re-lock (uv lock),
# and re-run the slice tests before promoting a new container
dependencies = [
    "pandas==2.2.3",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "networkx==3.4",
    "pydantic==2.13.3",
    "matplotlib==3.8.4",
    "requests==2.33.1",
    "duckdb==1.1.1",        # 07_build_release.py
]

[dependency-groups]
dev = ["pytest==8.2.1"]

[tool.uv]
package = false    # a set of scripts, not an installable package

[tool.pytest.ini_options]
testpaths = ["tests"]
