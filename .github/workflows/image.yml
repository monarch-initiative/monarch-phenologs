# The container image, ghcr.io/monarch-initiative/monarch-phenologs, built when run from the Actions tab (Run workflow),
# from any branch. Every build is tagged with its date and time in UTC (e.g. 2026-10-19-2315), the tag a release pipeline
# pins. A build from main also moves latest, and an extra tag (e.g. dev) can be given to move to it as well
name: Build Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Extra tag to move to this image too, e.g. dev (optional)
        required: false
        type: string

env:
  IMAGE: ghcr.io/monarch-initiative/monarch-phenologs

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Tags
        id: v
        env:
          TAG: ${{ inputs.tag }}
        run: |
          stamp=$(date -u +%Y-%m-%d-%H%M)
          tags="$IMAGE:$stamp"
          if [ "$GITHUB_REF_NAME" = main ]; then tags="$tags,$IMAGE:latest"; fi
          if [ -n "$TAG" ]; then tags="$tags,$IMAGE:$TAG"; fi
          {
            echo "stamp=$stamp"
            echo "commit=${GITHUB_SHA::7}"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
          echo "Tags: $tags" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          build-args: |
            PHENOLOGS_IMAGE=${{ steps.v.outputs.stamp }}
            PHENOLOGS_COMMIT=${{ steps.v.outputs.commit }}
          labels: org.opencontainers.image.source=https://github.com/monarch-initiative/monarch-phenologs
