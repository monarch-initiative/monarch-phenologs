# The container image, ghcr.io/monarch-initiative/monarch-phenologs, built when run from the Actions tab (Run workflow).
# Left empty, the tag is the version in pyproject.toml, and latest moves to the new image. Any other tag (e.g. dev) is
# for trying a branch out. Running it again under the same tag replaces that image
name: Build Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (leave empty for the version in pyproject.toml, which also moves latest)
        required: false
        type: string

env:
  IMAGE: ghcr.io/monarch-initiative/monarch-phenologs

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Tags and commit
        id: v
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
            echo "tags=$IMAGE:$version,$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          build-args: PHENOLOGS_COMMIT=${{ steps.v.outputs.commit }}
          labels: org.opencontainers.image.source=https://github.com/monarch-initiative/monarch-phenologs
