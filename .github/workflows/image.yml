# The container image, ghcr.io/monarch-initiative/monarch-phenologs. Built for every published GitHub release (tagged
# with the release's tag and latest), or by hand from any branch under any tag (Actions > image > Run workflow).
# Pushing a tag again moves it to the new image. The image records the code it holds (git describe) as PHENOLOGS_VERSION
name: image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: dev

env:
  IMAGE: ghcr.io/monarch-initiative/monarch-phenologs

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0              # every tag, for git describe
      - name: Version and tags
        id: v
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          echo "version=$(git describe --tags --long --always)" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_TAG" ]; then
            echo "tags=$IMAGE:$RELEASE_TAG,$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:$INPUT_TAG" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          build-args: PHENOLOGS_VERSION=${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/monarch-initiative/monarch-phenologs
