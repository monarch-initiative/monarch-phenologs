# The dashboard (dashboard/) on GitHub Pages, for every push to main that changes it, or from the Actions tab. The site
# reads the releases from the Monarch data bucket, so a new data release needs no deploy. Pages has to be turned on
# once first: Settings, Pages, Source "GitHub Actions"
name: Pages

on:
  push:
    branches: [main]
    paths: [dashboard/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v5
